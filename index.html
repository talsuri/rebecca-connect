<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SURI · Tal Lewis</title>
  <meta name="description" content="Save Tal Lewis's contact. A SURI brush, on me." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="block">
      <h1 class="wordmark"><img src="suri-logo.png" alt="SURI" /></h1>
      <p class="who">Rebecca Carr</p>
    </section>

    <hr class="rule" />

    <!-- Brush: name + email only. Tal mentions the brush in person. -->
    <section class="block">
      <form id="capture-form" autocomplete="on" novalidate>
        <!-- Honeypot: hidden from people; bots tend to fill it. If filled, the server silently ignores. -->
        <input type="text" id="website" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <input type="email" id="email" name="email" required placeholder="Email"
               autocomplete="email" inputmode="email"
               autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
        <button type="submit" id="submit-btn" class="btn">Send</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
